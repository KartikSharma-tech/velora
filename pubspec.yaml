name: velora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^16.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_database: ^12.0.0
  firebase_messaging: ^16.0.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  http: ^1.2.2

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Contacts
  flutter_contacts: ^1.1.9+2
  phone_numbers_parser: ^6.0.0

  # Share
  share_plus: 13.3.0

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true